version: '3.8'

services:
  odoo-mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ODOO_URL=${ODOO_URL:-https://your-odoo-instance.example.com}
      - ODOO_DB=${ODOO_DB:-your-database-name}
      - ODOO_API_KEY=${ODOO_API_KEY}
      - OAUTH_AUTHORIZATION_SERVER=${OAUTH_AUTHORIZATION_SERVER:-https://auth.example.com}
      - OAUTH_RESOURCE_IDENTIFIER=${OAUTH_RESOURCE_IDENTIFIER:-https://your-mcp-server.example.com}
      - DEBUG=${DEBUG:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Only needed if USER_KEY_VAULT_PATH/USER_KEY_VAULT_ENCRYPTION_KEY are set
    # (per-user Odoo credential vault, see odoo/user_vault.py). Mount a
    # DIRECTORY, not a single file: without a volume the vault file only
    # ever exists inside the container's own throwaway filesystem, so every
    # rebuild silently wipes it. A single-file bind mount isn't enough
    # either - Docker auto-creates the missing parent directory as root, so
    # the app's non-root user can read the mounted file but can't create the
    # temp file it needs for its atomic write (self-service linking fails
    # with PermissionError even though reads work). Mounting the containing
    # directory gives the app user write access to that directory too.
    # volumes:
    #   - ./vault_data:/opt/odoo-mcp/vault_data
    # (and set USER_KEY_VAULT_PATH=/opt/odoo-mcp/vault_data/user_credentials.json)

  # For local development testing
  mock-auth-server:
    image: mockserver/mockserver:latest
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    profiles:
      - testing

  # For running E2E tests
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.49.0-jammy
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      - TEST_MCP_SERVER_URL=http://odoo-mcp-server:8080
      - TEST_AUTH_SERVER_URL=http://mock-auth-server:1080
    command: pytest tests/e2e -v
    depends_on:
      - odoo-mcp-server
      - mock-auth-server
    profiles:
      - testing
